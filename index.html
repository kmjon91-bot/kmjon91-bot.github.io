<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>살아나는 마법책</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#241430; --ink:#140a1a; --wax:#f2e3c6; --ember:#e8772e; --moss:#6f9152;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 90% at 50% 0%, #3a2150 0%, var(--plum) 45%, var(--ink) 100%);
    color:var(--wax);
    font-family:'Gaegu', 'Apple SD Gothic Neo', sans-serif;
    min-height:100%;
    display:flex;justify-content:center;
    padding:max(20px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
  }
  main{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center}
  .hidden{display:none !important}

  /* 첫 화면 */
  #start{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:28px;padding:30px 0}
  .bigeye{width:170px;height:170px;border-radius:50%;background:#f7efe0;position:relative;overflow:hidden;
    border:6px solid #1a0f10;box-shadow:0 0 0 10px var(--moss), 0 0 60px rgba(232,119,46,.35)}
  .iris{position:absolute;width:74px;height:74px;border-radius:50%;left:50%;top:50%;margin:-37px 0 0 -37px;
    background:radial-gradient(circle at 50% 50%, #140a1a 0 30%, #c8321e 31% 62%, #7a1410 63%);transition:transform .12s linear}
  .lid{position:absolute;left:0;right:0;height:50%;background:var(--moss);animation:blink 4s infinite}
  .lid.top{top:0;transform-origin:top;border-bottom:5px solid #1a0f10}
  .lid.bot{bottom:0;transform-origin:bottom;border-top:5px solid #1a0f10}
  @keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
  @media (prefers-reduced-motion:reduce){.lid{animation:none}}
  h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:44px;line-height:1.1;color:var(--wax);
    text-shadow:3px 3px 0 #1a0f10, 0 0 24px rgba(111,145,82,.6)}
  .lead{font-size:22px;line-height:1.4;color:#d9c9ea;max-width:22em}
  .shoot{display:inline-flex;align-items:center;gap:10px;background:var(--ember);color:#1a0f10;
    font-family:'Black Han Sans',sans-serif;font-size:24px;padding:18px 34px;border-radius:999px;cursor:pointer;
    border:3px solid #1a0f10;box-shadow:0 6px 0 #1a0f10;transition:transform .08s}
  .shoot:active{transform:translateY(4px);box-shadow:0 2px 0 #1a0f10}
  .shoot:focus-within{outline:3px solid var(--wax);outline-offset:4px}
  input[type=file]{position:absolute;opacity:0;width:1px;height:1px}

  /* 재생 화면 */
  #play{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
  .stage{position:relative;width:100%;border-radius:18px;overflow:hidden;border:4px solid #1a0f10;
    box-shadow:0 0 0 4px var(--moss), 0 20px 50px rgba(0,0,0,.6);background:#000}
  #out{display:block;width:100%;height:auto;touch-action:manipulation;cursor:crosshair}
  #mute{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:2px solid #1a0f10;
    background:rgba(242,227,198,.9);font-size:20px;cursor:pointer}
  .hint{font-size:19px;color:#cbb8de;text-align:center}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%}
  .btn{flex:1;min-width:140px;font-family:'Black Han Sans',sans-serif;font-size:20px;padding:15px 18px;border-radius:999px;
    border:3px solid #1a0f10;cursor:pointer;box-shadow:0 5px 0 #1a0f10}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1a0f10}
  .btn.main{background:var(--ember);color:#1a0f10}
  .btn.sub{background:var(--wax);color:#1a0f10}
  .btn:disabled{opacity:.6}
  #msg{font-size:20px;color:var(--ember);min-height:1.4em;text-align:center}
</style>
</head>
<body>
<main>
  <section id="start">
    <div class="bigeye" aria-hidden="true"><div class="iris" id="iris"></div><div class="lid top"></div><div class="lid bot"></div></div>
    <h1>살아나는 마법책</h1>
    <p class="lead">만든 작품을 찍으면 5초 동안 살아서 움직여요.</p>
    <label class="shoot" id="shootBtn">📷 사진 찍기 · 올리기
      <input type="file" id="file" accept="image/*">
    </label>
  </section>

  <section id="play" class="hidden">
    <div class="stage">
      <canvas id="out"></canvas>
      <button id="mute" aria-label="소리 끄기">🔊</button>
    </div>
    <p class="hint">눈이 엉뚱한 곳에 생기면 진짜 눈 위치를 톡 눌러주세요</p>
    <div class="row">
      <button class="btn main" id="saveBtn">💾 영상 저장</button>
      <button class="btn sub" id="againBtn">📷 다른 사진</button>
    </div>
    <p id="msg" role="status"></p>
  </section>
</main>

<script>
(() => {
const DUR = 5;               // 영상 길이(초)
const MAXSIDE = 720;         // 처리 해상도
const $ = id => document.getElementById(id);

/* ---------- 첫 화면 눈동자가 손가락/마우스를 따라봄 ---------- */
addEventListener('pointermove', e => {
  const iris = $('iris'); if (!iris) return;
  const r = iris.parentElement.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
  const d = Math.hypot(dx, dy) || 1, m = Math.min(34, d/6);
  iris.style.transform = `translate(${dx/d*m}px, ${dy/d*m}px)`;
});

/* ---------- 상태 ---------- */
let src, W, H, small, eye = {x:.5, y:.45, r:.12}, lid = [0.35,0.45,0.3];
let gl, glc, prog, U = {}, tex, out, octx;
let start = 0, prevT = -1, look = {x:0,y:0}, rafId = 0, recording = false;
let actx, master, dest, noiseBuf, muted = false;
const rnd = n => { const s = Math.sin(n*127.1+311.7)*43758.5453; return s - Math.floor(s); };

/* ---------- 오디오 ---------- */
function initAudio(){
  if (actx) { actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.8;
    master.connect(actx.destination);
    if (actx.createMediaStreamDestination) { dest = actx.createMediaStreamDestination(); master.connect(dest); }
    noiseBuf = actx.createBuffer(1, actx.sampleRate*2, actx.sampleRate);
    const ch = noiseBuf.getChannelData(0); for (let i=0;i<ch.length;i++) ch[i] = Math.random()*2-1;
    // 낮게 웅웅거리는 배경음
    const f = actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 260;
    const g = actx.createGain(); g.gain.value = 0.07;
    [55, 55.8, 82.4].forEach(fr => { const o = actx.createOscillator(); o.type='sawtooth'; o.frequency.value=fr; o.connect(f); o.start(); });
    const lfo = actx.createOscillator(), lg = actx.createGain(); lfo.frequency.value = .3; lg.gain.value = 120;
    lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    f.connect(g); g.connect(master);
  } catch(e) { actx = null; }
}
function env(node, t0, a, peak, d){ const g = actx.createGain(); g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(peak, t0+a); g.gain.exponentialRampToValueAtTime(0.0001, t0+a+d);
  node.connect(g); g.connect(master); return g; }
function noise(t0, dur, freq, peak){ const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = freq; s.connect(f);
  env(f, t0, .02, peak, dur); s.start(t0); s.stop(t0+dur+.1); }
function tone(t0, type, f0, f1, dur, peak){ const o = actx.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0,t0); o.frequency.exponentialRampToValueAtTime(f1, t0+dur);
  env(o, t0, .03, peak, dur); o.start(t0); o.stop(t0+dur+.1); }
const SOUNDS = [
  [1.0, t => tone(t,'sawtooth',70,150,.6,.18)],                 // 끼이익 (눈 뜨는 소리)
  [2.0, t => noise(t,1.6,380,.6)],                              // 천둥
  [3.0, t => tone(t,'sine',70,40,.18,.5)],                      // 심장 쿵
  [3.45,t => tone(t,'sine',70,40,.18,.55)],
  [3.9, t => tone(t,'sine',70,40,.18,.6)],
  [4.45,t => { noise(t,.7,2500,.5); tone(t,'sawtooth',260,900,.35,.25); tone(t+.3,'sawtooth',900,120,.4,.2); }], // 깜짝!
];

/* ---------- 사진 읽기 ---------- */
$('shootBtn').addEventListener('click', initAudio);
$('file').addEventListener('change', e => { const f = e.target.files[0]; if (f) load(f); });

function load(file){
  const img = new Image();
  img.onload = () => {
    const k = Math.min(1, MAXSIDE / Math.max(img.naturalWidth, img.naturalHeight));
    W = Math.round(img.naturalWidth*k); H = Math.round(img.naturalHeight*k);
    src = document.createElement('canvas'); src.width = W; src.height = H;
    src.getContext('2d').drawImage(img, 0, 0, W, H);
    URL.revokeObjectURL(img.src);
    findEye();
    if (!setupGL()) { $('msg').textContent = '이 기기는 애니메이션을 지원하지 않아요. 다른 브라우저로 열어주세요.'; return; }
    $('start').classList.add('hidden'); $('play').classList.remove('hidden');
    restart(); loop();
  };
  img.onerror = () => alert('사진을 열 수 없어요. 다른 사진으로 해볼까요?');
  img.src = URL.createObjectURL(file);
}

/* ---------- 사진에서 '눈'이 될 곳 자동으로 찾기 ---------- */
function findEye(){
  const S = 90, k = S/Math.max(W,H), w = Math.max(8,Math.round(W*k)), h = Math.max(8,Math.round(H*k));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const cx = c.getContext('2d'); cx.drawImage(src,0,0,w,h);
  const d = cx.getImageData(0,0,w,h).data; small = {d,w,h};
  let mr=0,mg=0,mb=0; const n = w*h;
  for (let i=0;i<n;i++){ mr+=d[i*4]; mg+=d[i*4+1]; mb+=d[i*4+2]; }
  mr/=n; mg/=n; mb/=n;
  let sal = new Float32Array(n);
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const i=y*w+x, r=d[i*4], g=d[i*4+1], b=d[i*4+2];
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    let s = Math.hypot(r-mr,g-mg,b-mb) + 0.35*(mx-mn);
    const dx=x/w-.5, dy=y/h-.45; s *= Math.max(.08, 1-1.9*(dx*dx+dy*dy));   // 가운데일수록 가산점
    sal[i]=s;
  }
  for (let p=0;p<3;p++){ const t=new Float32Array(n);
    for (let y=0;y<h;y++) for (let x=0;x<w;x++){ let s=0,c2=0;
      for (let j=-1;j<=1;j++) for (let i=-1;i<=1;i++){ const X=x+i,Y=y+j; if(X>=0&&Y>=0&&X<w&&Y<h){s+=sal[Y*w+X];c2++;} }
      t[y*w+x]=s/c2; }
    sal=t; }
  let best=0, bi=0; for (let i=0;i<n;i++) if (sal[i]>best){best=sal[i];bi=i;}
  // 가장 튀는 점 주변 덩어리 크기로 눈 크기 결정
  const th = best*.6, seen = new Uint8Array(n), st=[bi]; let cnt=0, sx=0, sy=0; seen[bi]=1;
  while (st.length){ const i=st.pop(), x=i%w, y=(i/w)|0; cnt++; sx+=x; sy+=y;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{ const X=x+a,Y=y+b,j=Y*w+X;
      if(X>=0&&Y>=0&&X<w&&Y<h&&!seen[j]&&sal[j]>th){seen[j]=1;st.push(j);} }); }
  const px = sx/cnt, py = sy/cnt;
  const r = Math.min(.2, Math.max(.07, Math.sqrt(cnt/Math.PI)/h*1.1));
  setEye((px+.5)/w, (py+.5)/h, r);
}
function setEye(x, y, r){
  eye = {x:Math.min(.95,Math.max(.05,x)), y:Math.min(.95,Math.max(.05,y)), r};
  // 눈꺼풀 색 = 눈 주변 색 평균 (책 표지 색을 그대로 가져옴)
  const {d,w,h} = small, R = r*h; let s=[0,0,0], c=0;
  for (let yy=0;yy<h;yy++) for (let xx=0;xx<w;xx++){
    const dist = Math.hypot(xx+.5-eye.x*w, yy+.5-eye.y*h);
    if (dist>R*1.3 && dist<R*1.9){ const i=(yy*w+xx)*4; s[0]+=d[i];s[1]+=d[i+1];s[2]+=d[i+2];c++; } }
  if (c) lid = s.map(v => v/c/255);
}

/* ---------- WebGL: 사진 픽셀 자체를 휘어서 움직임 ---------- */
const VS = `attribute vec2 p; varying vec2 v; void main(){ v=vec2(p.x*.5+.5,.5-p.y*.5); gl_Position=vec4(p,0.,1.); }`;
const FS = `
precision mediump float;
varying vec2 v;
uniform sampler2D img; uniform vec2 px; uniform float t, asp, r, open, wob, zoom, glitch, flash, red, glow, dark, breath;
uniform vec2 eye, lookv, shake; uniform vec3 lidc;
float h1(float n){ return fract(sin(n)*43758.5453); }
float lum(vec3 c){ return dot(c, vec3(.299,.587,.114)); }
vec3 S(vec2 u){ if(u.x<0.||u.x>1.||u.y<0.||u.y>1.) return vec3(.03,.0,.05); return texture2D(img,u).rgb; }
void main(){
  vec2 u = eye + (v-eye)/zoom + shake;
  vec2 c = u-.5; u = .5 + c*(1. - .02*breath*(1.-dot(c,c)));
  u.x += sin(u.y*9.+t*3.1)*.0035*wob;
  u.y += sin(u.x*7.+t*2.3)*.0035*wob;
  float band = floor(u.y*26.), tk = floor(t*18.);
  float g = step(1.-.3*glitch, h1(band+tk*3.1));
  u.x += g*(h1(band*1.7+tk)-.5)*.09*glitch;

  vec2 q = (u-eye)*vec2(asp,1.)/r; float d = length(q);
  float fall = 1.-smoothstep(.3,1.,d);
  vec2 su = u - (lookv*.4*fall*r)/vec2(asp,1.);
  su = eye + (su-eye)*(1.-.2*glow*fall);

  float ca = .0015 + .006*glitch;
  vec3 col = vec3(S(su+vec2(ca,0.)).r, S(su).g, S(su-vec2(ca,0.)).b);
  vec2 o = px*1.6;
  float e = length(vec2(lum(S(su+vec2(o.x,0.)))-lum(S(su-vec2(o.x,0.))), lum(S(su+vec2(0.,o.y)))-lum(S(su-vec2(0.,o.y)))));
  col = mix(col, floor(col*5.+.5)/5., .5);
  float L = lum(col); col = mix(vec3(L), col, 1.35);
  col = mix(col, col*vec3(.78,.62,1.), .28);
  col *= 1. - smoothstep(.07,.28,e)*.85;

  float inside = 1.-smoothstep(.97,1.04,d);
  float le = open*sqrt(max(0.,1.-q.x*q.x));
  float lm = smoothstep(le-.035, le+.035, abs(q.y))*inside;
  vec3 lc = lidc*(.7+.4*(1.-abs(q.y))); lc *= .9+.1*sin(q.y*38.);
  col = mix(col, lc, lm);
  float ln = (1.-smoothstep(0.,.07,abs(abs(q.y)-le)))*inside;
  col = mix(col, vec3(.05,.0,.03), ln*.9);
  col = mix(col, vec3(.05,.0,.03), (1.-smoothstep(0.,.05,abs(d-1.)))*.7);
  col += vec3(1.,.18,.05)*glow*.55*(1.-smoothstep(1.,1.7,d))*(1.-inside*.85)*(.7+.3*sin(t*14.));

  float vg = 1.-smoothstep(.28,.85,length(v-.5));
  col *= mix(.25,1.,vg);
  col *= .95+.05*sin(gl_FragCoord.y*2.5);
  col = mix(col, vec3(.86,.9,1.), flash);
  col = mix(col, vec3(.85,0.,.05), red*.55);
  gl_FragColor = vec4(col*dark, 1.);
}`;
function setupGL(){
  glc = document.createElement('canvas'); glc.width = W; glc.height = H;
  gl = glc.getContext('webgl', {preserveDrawingBuffer:true}) || glc.getContext('experimental-webgl', {preserveDrawingBuffer:true});
  if (!gl) return false;
  const sh = (type, s) => { const x = gl.createShader(type); gl.shaderSource(x, s); gl.compileShader(x);
    if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(x)); return x; };
  prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return false;
  gl.useProgram(prog);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  'img px t asp r open wob zoom glitch flash red glow dark breath eye lookv shake lidc'.split(' ')
    .forEach(n => U[n] = gl.getUniformLocation(prog, n));
  tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  gl.viewport(0,0,W,H);
  out = $('out'); out.width = W; out.height = H; octx = out.getContext('2d');
  return true;
}

/* ---------- 5초 연출 타임라인 ---------- */
const ease = x => { x = Math.max(0, Math.min(1, x)); return x*x*(3-2*x); };
function scene(t){
  const s = {};
  let open = (t>.62 && t<.72) ? .12 : 0;                                   // 자는 중 움찔
  if (t>=1 && t<1.5){ const k=(t-1)/.5; open = ease(k) + Math.sin(k*Math.PI)*.15; }  // 번쩍 눈 뜸
  else if (t>=1.5) open = 1;
  [[2.7,.16],[3.95,.1]].forEach(([b,du]) => { if (t>b && t<b+du) open *= Math.abs((t-b)/du*2-1); }); // 깜빡
  if (t>=4.45) open = 1.2;
  s.open = open;
  let lx=0, ly=0;
  if (t>=1.5 && t<2.5){ lx = Math.sin((t-1.5)*Math.PI*2)*.9; ly = Math.sin((t-1.5)*Math.PI*4)*.2; } // 두리번
  else if (t>=2.5 && t<3.6){ const k=Math.floor(t*5); lx=(rnd(k)-.5)*1.8; ly=(rnd(k+99)-.5)*1.1; } // 휙휙
  else if (t>=3.6){ lx=(Math.random()-.5)*.08; ly=(Math.random()-.5)*.08; }                       // 노려봄
  s.lx = lx; s.ly = ly;
  s.wob = .7 + (t>2&&t<3.6 ? 1.6 : 0) + (t>=4.45 ? 3 : 0);
  s.breath = Math.sin(t*2.6) * (t>3.6 ? 2 : 1);
  s.zoom = t<3.6 ? 1 : 1 + (t-3.6)*.14;
  if (t>=4.45) s.zoom = 1.13 + ease((t-4.45)/.15)*.4 + (t-4.45)*.25;
  const sh = t>=4.45 ? .014 : (t>2 && t<2.35 ? .005 : 0);
  s.sx = (Math.random()-.5)*sh; s.sy = (Math.random()-.5)*sh;
  s.glitch = t>=4.45 ? 1 : (Math.random()<.035 ? .5 : 0);
  s.flash = 0;
  [[2,.08,.85],[2.18,.12,.7],[4.45,.12,.65]].forEach(([a,du,p]) => { if (t>=a && t<a+du) s.flash = p*(1-(t-a)/du); });
  s.red = (t>=4.45 && t<4.85) ? 1-(t-4.45)/.4 : 0;
  s.glow = t<1.2 ? 0 : Math.min(1,(t-1.2)/1.6) * (t>=4.45 ? 1.6 : 1);
  let dk = ease(t/.5); if (t>4.85) dk *= 1-(t-4.85)/.15;
  s.dark = dk * (.86 + .14*Math.sin(t*23)*Math.sin(t*7.3));                 // 촛불 깜빡임
  return s;
}

/* ---------- 그 위에 그리는 만화 효과 (박쥐, 안개, 먼지, 자막) ---------- */
const motes = Array.from({length:36}, (_,i) => ({x:rnd(i), y:rnd(i+50), sp:.03+rnd(i+9)*.07, sz:.5+rnd(i+3)*1.5, ph:rnd(i+7)*6}));
function bat(x,y,s,f,rot){
  octx.save(); octx.translate(x,y); octx.rotate(rot); octx.scale(s,s);
  octx.fillStyle = '#0c0610';
  for (const side of [1,-1]){ octx.save(); octx.scale(side,1); octx.beginPath();
    octx.moveTo(0,-.05); octx.quadraticCurveTo(.45,-.55*f,1,-.2*f); octx.quadraticCurveTo(.82,.05,.66,.24);
    octx.quadraticCurveTo(.52,.04,.38,.26); octx.quadraticCurveTo(.22,.05,0,.18); octx.fill(); octx.restore(); }
  octx.beginPath(); octx.ellipse(0,.05,.13,.2,0,0,Math.PI*2); octx.fill();
  octx.fillStyle = '#ff3b1f'; octx.beginPath(); octx.arc(-.05,0,.03,0,7); octx.arc(.05,0,.03,0,7); octx.fill();
  octx.restore();
}
function burst(cx,cy,R,t){
  octx.save(); octx.translate(cx + (Math.random()-.5)*R*.08, cy + (Math.random()-.5)*R*.08); octx.rotate(Math.sin(t*40)*.05);
  const k = ease((t-4.45)/.12); octx.scale(k,k);
  octx.beginPath(); for (let i=0;i<24;i++){ const a=i/24*Math.PI*2, rr = i%2 ? R*.62 : R*(1+.12*rnd(i)); octx.lineTo(Math.cos(a)*rr*1.25, Math.sin(a)*rr*.8); }
  octx.closePath(); octx.fillStyle='#ffd23f'; octx.fill(); octx.lineWidth=R*.07; octx.strokeStyle='#1a0f10'; octx.stroke();
  octx.font = `${R*.55}px 'Black Han Sans', sans-serif`; octx.textAlign='center'; octx.textBaseline='middle';
  octx.lineWidth = R*.1; octx.strokeStyle='#1a0f10'; octx.strokeText('크아앙!',0,R*.03);
  octx.fillStyle='#e8322a'; octx.fillText('크아앙!',0,R*.03);
  octx.restore();
}
function overlay(t, s){
  const w = W, h = H, m = Math.min(w,h);
  octx.save(); octx.globalCompositeOperation = 'lighter';
  motes.forEach(p => { const y = ((p.y - t*p.sp) % 1 + 1) % 1, x = p.x + Math.sin(t*1.5+p.ph)*.02;
    const a = .35 + .35*Math.sin(t*4+p.ph); const R = m*.006*p.sz;
    const g = octx.createRadialGradient(x*w,y*h,0,x*w,y*h,R*3); g.addColorStop(0,`rgba(150,255,120,${a})`); g.addColorStop(1,'rgba(150,255,120,0)');
    octx.fillStyle = g; octx.fillRect(x*w-R*3,y*h-R*3,R*6,R*6); });
  octx.restore();
  for (let i=0;i<5;i++){                                                      // 바닥 안개
    const x = ((i*.27 + t*.03*(i%2?1:-1)) % 1.3 + 1.3) % 1.3 - .15, y = .92 + .05*Math.sin(i);
    const R = m*(.35+.1*i%3); const g = octx.createRadialGradient(x*w,y*h,0,x*w,y*h,R);
    g.addColorStop(0,`rgba(190,170,220,${.22*s.dark})`); g.addColorStop(1,'rgba(190,170,220,0)');
    octx.fillStyle = g; octx.fillRect(x*w-R,y*h-R,R*2,R*2); }
  if (t>=2 && t<3.9){                                                         // 눈에서 박쥐가 튀어나옴
    const ex = eye.x*w, ey = eye.y*h;
    for (let i=0;i<9;i++){ const p = (t-2-i*.07)/1.5; if (p<=0 || p>=1) continue;
      const a = i/9*Math.PI*2 + .4, dist = ease(p)*Math.max(w,h)*.75;
      const x = ex + Math.cos(a)*dist + Math.sin(t*9+i)*m*.02, y = ey + Math.sin(a)*dist*.8 - p*m*.15;
      bat(x, y, m*(.05+p*.13), Math.sin(t*34+i*1.3), Math.sin(t*5+i)*.3); } }
  if (t>=3 && t<4.4){                                                         // 자막
    const txt = '누가… 나를 깨웠지?', n = Math.min(txt.length, Math.floor((t-3)/.9*txt.length)+1);
    const fs = m*.085; octx.font = `${fs}px 'Black Han Sans', sans-serif`; octx.textAlign='center'; octx.textBaseline='alphabetic';
    const x = w/2 + (Math.random()-.5)*fs*.06, y = h - fs*.9;
    octx.lineWidth = fs*.18; octx.strokeStyle = '#140a1a'; octx.strokeText(txt.slice(0,n), x, y);
    octx.fillStyle = '#b6f08a'; octx.fillText(txt.slice(0,n), x, y); }
  if (t>=4.45 && t<4.9) burst(w/2, h*.3, m*.26, t);
}

/* ---------- 메인 루프 ---------- */
function restart(){ start = performance.now(); prevT = -1; }
function loop(){
  cancelAnimationFrame(rafId);
  const step = () => {
    let t = (performance.now() - start)/1000;
    if (!recording) t = t % DUR; else t = Math.min(t, DUR - .001);
    if (t < prevT) prevT = -1;
    if (actx && !muted) SOUNDS.forEach(([at, fn]) => { if (prevT < at && t >= at) fn(actx.currentTime); });
    prevT = t;
    const s = scene(t);
    look.x += (s.lx - look.x)*.35; look.y += (s.ly - look.y)*.35;
    gl.uniform1i(U.img,0); gl.uniform2f(U.px,1/W,1/H); gl.uniform1f(U.t,t); gl.uniform1f(U.asp,W/H);
    gl.uniform1f(U.r,eye.r); gl.uniform1f(U.open,s.open); gl.uniform1f(U.wob,s.wob); gl.uniform1f(U.zoom,s.zoom);
    gl.uniform1f(U.glitch,s.glitch); gl.uniform1f(U.flash,s.flash); gl.uniform1f(U.red,s.red); gl.uniform1f(U.glow,s.glow);
    gl.uniform1f(U.dark,s.dark); gl.uniform1f(U.breath,s.breath);
    gl.uniform2f(U.eye,eye.x,eye.y); gl.uniform2f(U.lookv,look.x,look.y); gl.uniform2f(U.shake,s.sx,s.sy);
    gl.uniform3f(U.lidc,lid[0],lid[1],lid[2]);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    octx.drawImage(glc,0,0);
    overlay(t, s);
    rafId = requestAnimationFrame(step);
  };
  rafId = requestAnimationFrame(step);
}

/* ---------- 눈 위치 직접 지정 ---------- */
$('out').addEventListener('click', e => {
  if (recording) return;
  const b = e.currentTarget.getBoundingClientRect();
  setEye((e.clientX-b.left)/b.width, (e.clientY-b.top)/b.height, eye.r);
  restart();
});

/* ---------- 소리 켜기/끄기 ---------- */
$('mute').addEventListener('click', e => {
  e.stopPropagation(); initAudio(); muted = !muted;
  if (master) master.gain.value = muted ? 0 : .8;
  $('mute').textContent = muted ? '🔇' : '🔊';
  $('mute').setAttribute('aria-label', muted ? '소리 켜기' : '소리 끄기');
});

/* ---------- 5초 영상 저장 ---------- */
$('saveBtn').addEventListener('click', () => {
  if (!out.captureStream || !window.MediaRecorder){ $('msg').textContent = '이 브라우저는 영상 저장을 지원하지 않아요. 크롬이나 사파리 최신 버전에서 해주세요.'; return; }
  initAudio();
  const types = ['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];
  const type = types.find(x => MediaRecorder.isTypeSupported(x)) || '';
  const stream = out.captureStream(30);
  if (dest && !muted) dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
  let rec; try { rec = new MediaRecorder(stream, type ? {mimeType:type, videoBitsPerSecond:5e6} : undefined); }
  catch(err){ $('msg').textContent = '영상 저장을 시작하지 못했어요. 다시 눌러주세요.'; return; }
  const chunks = [];
  rec.ondataavailable = ev => ev.data.size && chunks.push(ev.data);
  rec.onstop = async () => {
    recording = false; $('saveBtn').disabled = false; $('saveBtn').textContent = '💾 영상 저장';
    const mime = rec.mimeType || type || 'video/webm', ext = mime.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(chunks, {type:mime}), name = `살아나는책.${ext}`;
    const file = new File([blob], name, {type:mime});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      try { await navigator.share({files:[file], title:'살아나는 마법책'}); $('msg').textContent = '저장했어요'; return; } catch(e){}
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    $('msg').textContent = '저장했어요';
  };
  recording = true; $('saveBtn').disabled = true; $('saveBtn').textContent = '⏺ 녹화 중 (5초)'; $('msg').textContent = '';
  restart(); rec.start(); setTimeout(() => { rec.stop(); restart(); }, DUR*1000 + 150);
});

/* ---------- 다른 사진 ---------- */
$('againBtn').addEventListener('click', () => {
  cancelAnimationFrame(rafId); $('file').value = ''; $('msg').textContent = '';
  $('play').classList.add('hidden'); $('start').classList.remove('hidden');
});
})();
</script>
