<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👻 무서운 변신 애니메이터</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a0033 0%, #330033 50%, #001a33 100%);
            font-family: 'Arial Black', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        /* 배경 장식 */
        body::before {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 140, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(138, 43, 226, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            background: rgba(20, 10, 40, 0.9);
            border: 3px solid #ff6600;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 0 30px rgba(255, 102, 0, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        h1 {
            color: #ff6600;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 3px 3px 0 #000, 0 0 10px #ff3300;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; transform: scale(0.98); }
        }

        .upload-section {
            margin-bottom: 30px;
            text-align: center;
        }

        .upload-box {
            border: 3px dashed #ff6600;
            border-radius: 15px;
            padding: 40px 20px;
            background: rgba(255, 102, 0, 0.05);
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .upload-box:hover {
            background: rgba(255, 102, 0, 0.15);
            border-color: #ffaa00;
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.3);
        }

        .upload-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255, 102, 0, 0.1) 10px,
                rgba(255, 102, 0, 0.1) 20px
            );
            animation: slideStripes 20s linear infinite;
            pointer-events: none;
        }

        @keyframes slideStripes {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        #fileInput {
            display: none;
        }

        .upload-text {
            color: #ffaa00;
            font-size: 1.2em;
            font-weight: bold;
            position: relative;
            z-index: 1;
            text-shadow: 2px 2px 4px #000;
        }

        .upload-subtext {
            color: #999;
            font-size: 0.9em;
            margin-top: 10px;
        }

        .preview-section {
            display: none;
            margin-bottom: 30px;
        }

        .preview-section.active {
            display: block;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #animationCanvas {
            width: 100%;
            height: auto;
            border: 2px solid #ff6600;
            border-radius: 10px;
            background: #000;
            display: block;
            margin: 0 auto;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.3);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, #ff6600, #ffaa00);
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.3);
            box-shadow: 0 5px 15px rgba(255, 102, 0, 0.4);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.8);
        }

        button:active {
            transform: scale(0.95);
        }

        button.secondary {
            background: linear-gradient(135deg, #666, #888);
            color: #fff;
        }

        .loading {
            display: none;
            text-align: center;
            color: #ffaa00;
            font-weight: bold;
            margin: 20px 0;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading.active {
            display: block;
        }

        .info-box {
            background: rgba(255, 102, 0, 0.1);
            border-left: 4px solid #ff6600;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            color: #ffaa00;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .info-box strong {
            color: #ff6600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👻 무서운 변신기 🎃</h1>

        <div class="upload-section">
            <div class="upload-box" onclick="document.getElementById('fileInput').click()">
                <div class="upload-text">📸 사진을 여기에 올려놓으세요!</div>
                <div class="upload-subtext">또는 클릭해서 업로드</div>
            </div>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="loading" id="loading">⚡ 무서운 마법 시전 중... ⚡</div>

        <div class="preview-section" id="previewSection">
            <canvas id="animationCanvas"></canvas>

            <div class="controls">
                <button onclick="startAnimation()">▶ 애니메이션 시작</button>
                <button onclick="downloadAnimation()" class="secondary">⬇ 다운로드</button>
                <button onclick="resetUpload()" class="secondary">🔄 새 사진 올리기</button>
            </div>
        </div>

        <div class="info-box">
            <strong>⚡ 팁:</strong> 어떤 사진이든 올려도 됩니다! 인물, 풍경, 동물, 음식... 뭐든 무서운 할로윈 버전으로 변신합니다! 👹
        </div>
    </div>

    <script>
        let uploadedImage = null;
        let animationRunning = false;

        document.getElementById('fileInput').addEventListener('change', handleImageUpload);

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    uploadedImage = img;
                    showPreview();
                    startAnimation();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function showPreview() {
            document.getElementById('previewSection').classList.add('active');
            const canvas = document.getElementById('animationCanvas');
            canvas.width = uploadedImage.width;
            canvas.height = uploadedImage.height;
        }

        function startAnimation() {
            if (!uploadedImage) return;

            const canvas = document.getElementById('animationCanvas');
            const ctx = canvas.getContext('2d');

            document.getElementById('loading').classList.add('active');
            animationRunning = true;

            let frame = 0;
            const maxFrames = 120; // 5초 (24fps)
            const fps = 24;

            function animate() {
                if (!animationRunning) return;

                // 캔버스 클리어
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 원본 이미지 그리기
                ctx.globalAlpha = 1;
                ctx.filter = getHalloweenFilter(frame);
                ctx.drawImage(uploadedImage, 0, 0);

                // 할로윈 효과 오버레이
                drawHalloweenEffects(ctx, canvas, frame);

                frame++;

                if (frame < maxFrames) {
                    setTimeout(animate, 1000 / fps);
                } else {
                    animationRunning = false;
                    document.getElementById('loading').classList.remove('active');
                }
            }

            animate();
        }

        function getHalloweenFilter(frame) {
            const intensity = Math.sin(frame / 10) * 0.5 + 0.5;

            // 랜덤한 플래시/깜박임 효과
            if (frame % 20 < 3) {
                return `brightness(${1.2 + Math.random() * 0.3}) contrast(1.3) hue-rotate(${-30 + Math.random() * 20}deg) saturate(1.4)`;
            }

            // 일반 무서운 필터
            return `brightness(${0.7 + intensity * 0.3}) contrast(1.4) hue-rotate(-10deg) saturate(1.3)`;
        }

        function drawHalloweenEffects(ctx, canvas, frame) {
            const width = canvas.width;
            const height = canvas.height;

            // 1. 빨간색/주황색 번쩍임
            if (frame % 15 < 2) {
                ctx.fillStyle = `rgba(255, 102, 0, ${Math.random() * 0.3})`;
                ctx.fillRect(0, 0, width, height);
            }

            // 2. 검은색 테두리 무섭게
            ctx.strokeStyle = '#ff6600';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, 0, width, height);

            // 3. 눈 그리기 (왼쪽 위, 오른쪽 위)
            if (frame % 30 < 15) {
                drawEye(ctx, width * 0.2, height * 0.2, frame);
                drawEye(ctx, width * 0.8, height * 0.2, frame);
            }

            // 4. 입 모양 (아래쪽)
            if (frame % 40 > 10 && frame % 40 < 30) {
                drawMouth(ctx, width * 0.5, height * 0.85, frame);
            }

            // 5. 어두운 그림자 효과
            const shadowIntensity = Math.sin(frame / 5) * 0.5 + 0.5;
            ctx.fillStyle = `rgba(0, 0, 0, ${shadowIntensity * 0.3})`;
            ctx.fillRect(0, 0, width, height);

            // 6. 번쩍거리는 라인 (사진을 휘게)
            if (frame % 25 < 3) {
                ctx.strokeStyle = `rgba(255, 255, 255, ${Math.random() * 0.5})`;
                ctx.lineWidth = Math.random() * 3 + 1;
                for (let i = 0; i < 5; i++) {
                    ctx.beginPath();
                    ctx.moveTo(0, Math.random() * height);
                    ctx.lineTo(width, Math.random() * height);
                    ctx.stroke();
                }
            }

            // 7. 텍스트 오버레이 (간헐적)
            if (frame % 50 > 40) {
                ctx.fillStyle = `rgba(255, 0, 0, ${Math.random() * 0.8})`;
                ctx.font = `bold ${height * 0.15}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const messages = ['😱', '👻', '💀', '😵'];
                ctx.fillText(messages[Math.floor(Math.random() * messages.length)], width * 0.5, height * 0.5);
            }

            ctx.globalAlpha = 1;
        }

        function drawEye(ctx, x, y, frame) {
            const blink = Math.sin(frame / 8) * 0.5 + 0.5;
            const eyeSize = 20 * blink;

            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(x, y, eyeSize, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#000';
            const pupilSize = eyeSize * 0.6;
            ctx.beginPath();
            ctx.arc(x + 5, y + 5, pupilSize, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawMouth(ctx, x, y, frame) {
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(x - 40, y);
            ctx.quadraticCurveTo(x, y + 30, x + 40, y);
            ctx.stroke();
        }

        function downloadAnimation() {
            const canvas = document.getElementById('animationCanvas');
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'halloween-animation.png';
            link.click();
        }

        function resetUpload() {
            uploadedImage = null;
            animationRunning = false;
            document.getElementById('fileInput').value = '';
            document.getElementById('previewSection').classList.remove('active');
            document.getElementById('loading').classList.remove('active');
        }
    </script>
</body>
</html>
