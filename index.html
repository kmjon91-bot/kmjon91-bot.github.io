<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👻 무서운 변신기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a0033 0%, #330033 50%, #001a33 100%);
            font-family: 'Arial Black', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        /* 업로드 화면 */
        .upload-screen {
            background: rgba(20, 10, 40, 0.95);
            border: 3px solid #ff6600;
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 102, 0, 0.5);
        }

        .upload-screen.hidden {
            display: none;
        }

        .title {
            color: #ff6600;
            font-size: 2.5em;
            margin-bottom: 40px;
            text-shadow: 3px 3px 0 #000, 0 0 10px #ff3300;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .upload-box {
            border: 3px dashed #ff6600;
            border-radius: 15px;
            padding: 50px 30px;
            background: rgba(255, 102, 0, 0.05);
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .upload-box:hover {
            background: rgba(255, 102, 0, 0.15);
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.4);
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #ffaa00;
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .upload-subtext {
            color: #999;
            font-size: 0.95em;
        }

        #fileInput {
            display: none;
        }

        /* 애니메이션 화면 */
        .animation-screen {
            display: none;
            text-align: center;
        }

        .animation-screen.active {
            display: block;
        }

        #animationCanvas {
            width: 100%;
            max-width: 500px;
            border: 3px solid #ff6600;
            border-radius: 15px;
            background: #000;
            display: block;
            margin: 0 auto 30px;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.4);
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, #ff6600, #ffaa00);
            color: #000;
            border: none;
            padding: 15px 35px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(255, 102, 0, 0.4);
            font-family: 'Arial Black';
        }

        button:hover {
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.8);
        }

        button:active {
            transform: scale(0.95);
        }

        .loading {
            color: #ffaa00;
            font-size: 1.2em;
            font-weight: bold;
            animation: blink 0.8s infinite;
            margin: 20px 0;
        }

        @keyframes blink {
            0%, 49%, 100% { opacity: 1; }
            50%, 99% { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 업로드 화면 -->
        <div class="upload-screen" id="uploadScreen">
            <div class="title">👻 무서운 변신기 🎃</div>
            <div class="upload-box" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">📸</div>
                <div class="upload-text">사진을 올려보세요!</div>
                <div class="upload-subtext">클릭하거나 드래그 & 드롭</div>
            </div>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <!-- 애니메이션 화면 -->
        <div class="animation-screen" id="animationScreen">
            <div class="loading" id="loading">⚡ 무서운 마법 시전 중... ⚡</div>
            <canvas id="animationCanvas"></canvas>
            <div class="button-group">
                <button onclick="resetUpload()">🔄 다시 올리기</button>
            </div>
        </div>
    </div>

    <script>
        let uploadedImage = null;

        document.getElementById('fileInput').addEventListener('change', handleImageUpload);

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    uploadedImage = img;
                    showAnimationScreen();
                    startAnimation();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function showAnimationScreen() {
            document.getElementById('uploadScreen').classList.add('hidden');
            document.getElementById('animationScreen').classList.add('active');

            const canvas = document.getElementById('animationCanvas');
            canvas.width = uploadedImage.width;
            canvas.height = uploadedImage.height;
        }

        function startAnimation() {
            const canvas = document.getElementById('animationCanvas');
            const ctx = canvas.getContext('2d');

            document.getElementById('loading').style.display = 'block';

            let frame = 0;
            const maxFrames = 120;
            const fps = 24;

            function animate() {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const rotation = Math.sin(frame * 0.1) * 0.05;
                const scale = 1 + Math.sin(frame * 0.08) * 0.15;

                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(rotation);
                ctx.scale(scale, scale);
                ctx.translate(-canvas.width / 2, -canvas.height / 2);

                ctx.globalAlpha = 1;
                ctx.filter = getFilter(frame);
                ctx.drawImage(uploadedImage, 0, 0);

                ctx.restore();

                drawEffects(ctx, canvas, frame);

                frame++;

                if (frame < maxFrames) {
                    setTimeout(animate, 1000 / fps);
                } else {
                    document.getElementById('loading').style.display = 'none';
                }
            }

            animate();
        }

        function getFilter(frame) {
            const brightness = 0.6 + Math.sin(frame * 0.12) * 0.25;

            if (frame % 20 < 2) {
                return `brightness(1.4) contrast(1.5) saturate(1.2) hue-rotate(-20deg)`;
            }

            return `brightness(${brightness}) contrast(1.4) saturate(1.3) hue-rotate(-10deg)`;
        }

        function drawEffects(ctx, canvas, frame) {
            const w = canvas.width;
            const h = canvas.height;

            // 글리치 효과
            if (Math.random() > 0.7) {
                ctx.fillStyle = `rgba(255, 0, 0, 0.3)`;
                const y = Math.random() * h;
                const height = Math.random() * 30 + 5;
                const offset = Math.random() * 50 - 25;
                ctx.fillRect(offset, y, w - Math.abs(offset) * 2, height);
            }

            // 스캔라인
            if (frame % 5 === 0) {
                ctx.strokeStyle = `rgba(255, 255, 255, 0.1)`;
                ctx.lineWidth = 1;
                for (let i = 0; i < h; i += 4) {
                    ctx.beginPath();
                    ctx.moveTo(0, i);
                    ctx.lineTo(w, i);
                    ctx.stroke();
                }
            }

            // 빨간 플래시
            if (frame % 15 < 2) {
                ctx.fillStyle = `rgba(255, 0, 0, ${Math.random() * 0.4})`;
                ctx.fillRect(0, 0, w, h);
            }

            // 테두리
            ctx.strokeStyle = '#ff6600';
            ctx.lineWidth = 3;
            ctx.strokeRect(0, 0, w, h);

            // 떨어지는 눈물 효과
            if (frame % 30 < 20) {
                ctx.fillStyle = `rgba(255, 0, 0, 0.5)`;
                const eyeX = w * (0.2 + Math.sin(frame * 0.05) * 0.15);
                const eyeY = h * 0.25;
                const dropLength = Math.sin(frame * 0.1) * 40;
                
                ctx.beginPath();
                ctx.arc(eyeX, eyeY, 15, 0, Math.PI * 2);
                ctx.fill();
                
                if (dropLength > 0) {
                    ctx.fillRect(eyeX - 3, eyeY + 15, 6, dropLength);
                }

                const eyeX2 = w * (0.8 - Math.sin(frame * 0.05) * 0.15);
                ctx.beginPath();
                ctx.arc(eyeX2, eyeY, 15, 0, Math.PI * 2);
                ctx.fill();
                
                if (dropLength > 0) {
                    ctx.fillRect(eyeX2 - 3, eyeY + 15, 6, dropLength);
                }
            }

            // 입 모양
            if (frame % 40 > 10 && frame % 40 < 30) {
                ctx.strokeStyle = '#ff0000';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(w * 0.3, h * 0.8);
                ctx.quadraticCurveTo(w * 0.5, h * 0.9, w * 0.7, h * 0.8);
                ctx.stroke();
            }

            // 이모지 팝업
            if (frame % 50 > 35 && frame % 50 < 45) {
                const emojis = ['😱', '👻', '💀', '😵', '🤮'];
                const emoji = emojis[Math.floor(Math.random() * emojis.length)];
                ctx.font = `bold ${Math.min(w, h) * 0.25}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.globalAlpha = 0.7 + Math.random() * 0.3;
                ctx.fillText(emoji, w * 0.5, h * 0.5);
                ctx.globalAlpha = 1;
            }
        }

        function resetUpload() {
            uploadedImage = null;
            document.getElementById('uploadScreen').classList.remove('hidden');
            document.getElementById('animationScreen').classList.remove('active');
            document.getElementById('fileInput').value = '';
            document.getElementById('loading').style.display = 'block';
        }
    </script>
</body>
</html>
