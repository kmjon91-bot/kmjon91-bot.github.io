<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👻 무서운 변신기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a0033 0%, #330033 50%, #001a33 100%);
            font-family: 'Arial Black', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .upload-screen {
            background: rgba(20, 10, 40, 0.95);
            border: 3px solid #ff6600;
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 102, 0, 0.5);
        }

        .upload-screen.hidden {
            display: none;
        }

        .title {
            color: #ff6600;
            font-size: 2.5em;
            margin-bottom: 40px;
            text-shadow: 3px 3px 0 #000, 0 0 10px #ff3300;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .upload-box {
            border: 3px dashed #ff6600;
            border-radius: 15px;
            padding: 50px 30px;
            background: rgba(255, 102, 0, 0.05);
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .upload-box:hover {
            background: rgba(255, 102, 0, 0.15);
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.4);
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #ffaa00;
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .upload-subtext {
            color: #999;
            font-size: 0.95em;
        }

        #fileInput {
            display: none;
        }

        .animation-screen {
            display: none;
            text-align: center;
        }

        .animation-screen.active {
            display: block;
        }

        .canvas-container {
            position: relative;
            margin: 0 auto 30px;
            border: 3px solid #ff6600;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.4);
        }

        #animationCanvas {
            width: 100%;
            display: block;
            max-width: 500px;
        }

        #sourceCanvas {
            display: none;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, #ff6600, #ffaa00);
            color: #000;
            border: none;
            padding: 15px 35px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(255, 102, 0, 0.4);
            font-family: 'Arial Black';
        }

        button:hover {
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.8);
        }

        button:active {
            transform: scale(0.95);
        }

        .loading {
            color: #ffaa00;
            font-size: 1.2em;
            font-weight: bold;
            animation: blink 0.8s infinite;
            margin: 20px 0;
        }

        @keyframes blink {
            0%, 49%, 100% { opacity: 1; }
            50%, 99% { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="upload-screen" id="uploadScreen">
            <div class="title">👻 무서운 변신기 🎃</div>
            <div class="upload-box" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">📸</div>
                <div class="upload-text">사진을 올려보세요!</div>
                <div class="upload-subtext">클릭하거나 드래그 & 드롭</div>
            </div>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="animation-screen" id="animationScreen">
            <div class="loading" id="loading">⚡ 무서운 마법 시전 중... ⚡</div>
            <div class="canvas-container">
                <canvas id="animationCanvas"></canvas>
            </div>
            <div class="button-group">
                <button onclick="resetUpload()">🔄 다시 올리기</button>
            </div>
        </div>
    </div>

    <canvas id="sourceCanvas" style="display:none;"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>

    <script>
        let uploadedImage = null;
        let animationRunning = false;
        let facesDetected = [];

        document.getElementById('fileInput').addEventListener('change', handleImageUpload);

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    uploadedImage = img;
                    showAnimationScreen();
                    detectFacesAndAnimate();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function showAnimationScreen() {
            document.getElementById('uploadScreen').classList.add('hidden');
            document.getElementById('animationScreen').classList.add('active');

            const canvas = document.getElementById('animationCanvas');
            canvas.width = uploadedImage.width;
            canvas.height = uploadedImage.height;
        }

        async function detectFacesAndAnimate() {
            const faceDetection = new FaceDetection({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
            });

            faceDetection.setOptions({
                model: 'short_range'
            });

            const sourceCanvas = document.getElementById('sourceCanvas');
            const sourceCtx = sourceCanvas.getContext('2d');
            sourceCanvas.width = uploadedImage.width;
            sourceCanvas.height = uploadedImage.height;
            sourceCtx.drawImage(uploadedImage, 0, 0);

            faceDetection.onResults(onFacesDetected);

            await faceDetection.send({ image: sourceCanvas });
        }

        function onFacesDetected(results) {
            facesDetected = results.detections || [];
            document.getElementById('loading').style.display = 'none';
            startAnimation();
        }

        function startAnimation() {
            const canvas = document.getElementById('animationCanvas');
            const ctx = canvas.getContext('2d');

            let frame = 0;
            const maxFrames = 120;
            const fps = 24;
            animationRunning = true;

            function animate() {
                if (!animationRunning) return;

                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 전체 이미지에 효과 적용
                const rotation = Math.sin(frame * 0.08) * 0.03;
                const scale = 1 + Math.sin(frame * 0.06) * 0.1;
                const offsetY = Math.sin(frame * 0.1) * 8;

                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(rotation);
                ctx.scale(scale, scale);
                ctx.translate(-canvas.width / 2, -canvas.height / 2 + offsetY);

                // 필터 적용
                ctx.globalAlpha = 1;
                ctx.filter = getFilter(frame);
                ctx.drawImage(uploadedImage, 0, 0);

                ctx.restore();

                // 오버레이 효과
                drawAnimationEffects(ctx, canvas, frame);

                // 얼굴이 감지되면 눈/입 애니메이션
                if (facesDetected.length > 0) {
                    drawFaceAnimations(ctx, canvas, frame);
                }

                frame++;

                if (frame < maxFrames) {
                    setTimeout(animate, 1000 / fps);
                } else {
                    animationRunning = false;
                }
            }

            animate();
        }

        function getFilter(frame) {
            const brightness = 0.65 + Math.sin(frame * 0.12) * 0.25;

            if (frame % 20 < 2) {
                return `brightness(1.5) contrast(1.6) saturate(1.3) hue-rotate(-25deg)`;
            }

            return `brightness(${brightness}) contrast(1.45) saturate(1.35) hue-rotate(-12deg)`;
        }

        function drawAnimationEffects(ctx, canvas, frame) {
            const w = canvas.width;
            const h = canvas.height;

            // 글리치 효과
            if (Math.random() > 0.75) {
                ctx.fillStyle = `rgba(255, 0, 0, 0.25)`;
                const y = Math.random() * h;
                const height = Math.random() * 25 + 8;
                const offset = Math.random() * 40 - 20;
                ctx.fillRect(offset, y, w - Math.abs(offset) * 2, height);
            }

            // 스캔라인
            if (frame % 4 === 0) {
                ctx.strokeStyle = `rgba(255, 255, 255, 0.08)`;
                ctx.lineWidth = 1;
                for (let i = 0; i < h; i += 3) {
                    ctx.beginPath();
                    ctx.moveTo(0, i);
                    ctx.lineTo(w, i);
                    ctx.stroke();
                }
            }

            // 플래시
            if (frame % 18 < 2) {
                ctx.fillStyle = `rgba(255, 0, 0, ${Math.random() * 0.35})`;
                ctx.fillRect(0, 0, w, h);
            }

            // 테두리
            ctx.strokeStyle = '#ff6600';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, 0, w, h);
        }

        function drawFaceAnimations(ctx, canvas, frame) {
            const w = canvas.width;
            const h = canvas.height;

            facesDetected.forEach((detection) => {
                const boundingBox = detection.boundingBox;
                const start = boundingBox.xMin * w;
                const top = boundingBox.yMin * h;
                const width = boundingBox.width * w;
                const height = boundingBox.height * h;

                // 얼굴 중심
                const centerX = start + width / 2;
                const centerY = top + height / 2;

                // 눈 위치 (얼굴 상단 1/3)
                const eyeY = top + height * 0.25;
                const leftEyeX = centerX - width * 0.15;
                const rightEyeX = centerX + width * 0.15;

                // 눈이 살아있게 움직임
                const eyeMovement = Math.sin(frame * 0.15) * 0.3;
                const eyeBlinkAmount = Math.abs(Math.sin(frame * 0.2));

                // 왼쪽 눈
                drawLivingEye(ctx, leftEyeX, eyeY, width * 0.08, frame, eyeBlinkAmount, eyeMovement);

                // 오른쪽 눈
                drawLivingEye(ctx, rightEyeX, eyeY, width * 0.08, frame, eyeBlinkAmount, eyeMovement);

                // 입 위치
                const mouthY = top + height * 0.75;
                drawLivingMouth(ctx, centerX, mouthY, width * 0.2, frame);

                // 눈물 효과
                if (frame % 30 < 20) {
                    const dropLength = Math.sin(frame * 0.12) * (height * 0.15);
                    if (dropLength > 2) {
                        ctx.fillStyle = `rgba(255, 0, 0, 0.4)`;
                        ctx.fillRect(leftEyeX - 2, eyeY + width * 0.08, 4, dropLength);
                        ctx.fillRect(rightEyeX - 2, eyeY + width * 0.08, 4, dropLength);
                    }
                }
            });
        }

        function drawLivingEye(ctx, x, y, size, frame, blink, movement) {
            // 깜빡임
            const eyeHeight = size * (1 - blink * 0.8);

            // 흰자
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(x, y, size * 0.8, eyeHeight * 0.6, 0, 0, Math.PI * 2);
            ctx.fill();

            // 동공 (움직임 있음)
            const pupilX = x + Math.sin(frame * 0.12) * size * 0.3;
            const pupilY = y + Math.cos(frame * 0.15) * eyeHeight * 0.2;

            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(pupilX, pupilY, size * 0.4, 0, Math.PI * 2);
            ctx.fill();

            // 빛 반사
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.beginPath();
            ctx.arc(pupilX - size * 0.15, pupilY - size * 0.15, size * 0.15, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawLivingMouth(ctx, x, y, width, frame) {
            const mouthOpen = Math.abs(Math.sin(frame * 0.18)) * 0.7;

            if (frame % 35 > 8) {
                ctx.strokeStyle = '#ff0000';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(x - width / 2, y);
                ctx.quadraticCurveTo(x, y + width * 0.3 * mouthOpen, x + width / 2, y);
                ctx.stroke();

                // 혀
                if (mouthOpen > 0.5) {
                    ctx.fillStyle = `rgba(255, 100, 100, 0.5)`;
                    ctx.beginPath();
                    ctx.ellipse(x, y + width * 0.2 * mouthOpen, width * 0.15, width * 0.1 * mouthOpen, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function resetUpload() {
            uploadedImage = null;
            animationRunning = false;
            facesDetected = [];
            document.getElementById('uploadScreen').classList.remove('hidden');
            document.getElementById('animationScreen').classList.remove('active');
            document.getElementById('fileInput').value = '';
            document.getElementById('loading').style.display = 'block';
        }
    </script>
</body>
</html>
